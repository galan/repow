name: Create Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27.3

    - name: Set Version Variable for ldflags
      run: echo "VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV

    - name: Build
      run: make build

    - name: Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body: "[Changelog](https://github.com/galan/repow/blob/master/CHANGELOG.md)"
        draft: false
        prerelease: false
        files: |
          bin/repow-linux-amd64
          bin/repow-linux-arm64
          bin/repow-darwin-amd64
          bin/repow-darwin-arm64
          bin/repow-windows-amd64.exe
